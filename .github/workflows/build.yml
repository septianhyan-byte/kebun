name: Build & Verify MelonFlow NFT

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, Lint Rules & Build PWA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Lint Firestore security rules
        run: npx eslint firestore.rules

      - name: Build production web & PWA bundle
        run: npm run build

      - name: Verify PWA manifest & service worker output
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js

      - name: Upload dist build artifact
        uses: actions/upload-artifact@v4
        with:
          name: melonflow-nft-dist
          path: dist/
          retention-days: 14
